}

.menu-wrap{
    display:grid;

}

.menu-box{
    background:white;
    border:1px solid #d9d9d9;
    border-radius:5px;
    height:95px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-decoration:none;
    transition:0.2s;
}

.menu-box:hover{
    background:#f8f8f8;
    box-shadow:0 0 5px rgba(0,0,0,0.15);
}

.menu-title{
    font-size:15px;
    font-weight:bold;
    color:black;
    margin-bottom:5px;
}

.menu-text{
    font-size:12px;
    color:black;
    text-decoration:underline;
}
</style>
